<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KLSB Dashboard</title>
  <!-- favicon optional; omitted to avoid file:// path issues -->
    <style>
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,'Noto Sans','Apple Color Emoji','Segoe UI Emoji';margin:0;background:linear-gradient(180deg,#0b1e3a,#0e2b57,#0b1e3a);min-height:100vh;color:#0b1e3a}
      .shell{max-width:1100px;margin:0 auto;padding:24px}
      .card{background:#ffffffE6;border:1px solid rgba(255,255,255,.4);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1);padding:20px}
      header{display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:16px}
      nav a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid transparent;color:#fff;text-decoration:none}
      nav a:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
      .grid{display:grid;gap:10px;grid-template-columns:repeat(1,minmax(0,1fr))}
      @media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
      @media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
      .tile{background:#fff;border:1px solid #cfe0f4;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(10,40,80,.08)}
      .brand{position:relative}
      .brand .diamond{position:absolute;left:50%;transform:translateX(-50%) rotate(45deg);top:-10px;width:20px;height:20px;background:#facc15;border-radius:2px;box-shadow:0 10px 20px rgba(234,179,8,.4)}
      footer{color:#fff;opacity:.7;margin-top:20px;font-size:12px;text-align:center}
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
  <img src="../logo-full.svg" alt="KLSB Logo" height="48" />
        <div class="brand"><div class="diamond"></div></div>
        <div style="margin-left:auto"></div>
      </header>
      <div class="card">
        <h1>Dashboard</h1>
        <p>Select a department:</p>
        <nav>
          <div class="grid">
            <a href="../departments/finance/index.html">💰 Finance</a>
            <a href="../departments/recruit/index.html">🧾 Recruitment</a>
            <a href="../departments/tender/index.html">📄 Tender & Proposal</a>
            <a href="../departments/hr/index.html">🕒 Human Resources</a>
            <a href="../departments/bd/index.html">📈 Business Development</a>
            <a href="../departments/eng/index.html">🛠️ Engineering</a>
          </div>
        </nav>
      </div>
      <footer>v0.0.1</footer>
    </div>
  </body>
  </html>
